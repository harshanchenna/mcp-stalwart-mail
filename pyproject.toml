[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stalwart-mail-mcp"
version = "0.1.0"
description = "MCP server for sending email via Stalwart mail server (SMTP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Harshan Chenna", email = "harshu.c18@gmail.com" },
]
keywords = ["mcp", "email", "smtp", "stalwart", "claude"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.urls]
Repository = "https://github.com/harshanchenna/mcp-stalwart-mail"

[project.scripts]
stalwart-mail-mcp = "stalwart_mail_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stalwart_mail_mcp"]
